<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --paper: #f7f3ea;
    --paper-edge: #efe8d8;
    --ink: #2b2620;
    --ink-soft: #5a5346;
    --rule: #d8cfbe;
    --accent: #7a2e2e;
    --desk: #cbc2b0;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    font-family: 'Crimson Pro', Georgia, serif;
    background:
      radial-gradient(ellipse at top, #d7cdb9, var(--desk) 70%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: clamp(16px, 4vw, 32px) 16px;
  }

  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(12px, 2.5vw, 18px);
    width: 100%;
    max-height: 100dvh;
  }

  .sheet-wrap{
    position: relative;
    width: min(640px, 92vw);
  }

  .sheet{
    background: var(--paper);
    background-image: linear-gradient(var(--paper-edge) 1px, transparent 1px);
    background-size: 100% 34px;
    padding: clamp(40px, 8vw, 70px) clamp(24px, 6vw, 60px) clamp(32px, 6vw, 60px);
    height: min(780px, 72dvh);
    box-shadow:
      0 1px 0 var(--paper-edge),
      0 25px 50px -12px rgba(30, 25, 15, 0.35),
      0 8px 16px -8px rgba(30, 25, 15, 0.25);
    position: relative;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sheet::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0%, transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0%, transparent 40%);
    pointer-events: none;
  }

  .page-number{
    position: absolute;
    top: clamp(18px, 4vw, 26px);
    right: clamp(20px, 5vw, 34px);
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-style: italic;
  }

  .page-content{
    flex: 1;
    font-size: clamp(16px, 2.4vw, 19px);
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .signature-line{
    margin-top: 18px;
    height: 1px;
    background: var(--rule);
    display: none;
  }

  .controls{
    display: flex;
    align-items: center;
    gap: 22px;
    user-select: none;
  }

  .nav-btn{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(43, 38, 32, 0.25);
    background: rgba(247, 243, 234, 0.6);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .nav-btn:hover{ background: rgba(247, 243, 234, 0.95); }
  .nav-btn:active{ transform: scale(0.94); }
  .nav-btn:disabled{ opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover{ background: rgba(247, 243, 234, 0.6); }

  .counter{
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    min-width: 64px;
    text-align: center;
  }

  .dots{
    display: flex;
    gap: 8px;
  }

  .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(43, 38, 32, 0.25);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .dot.active{ background: var(--accent); }

  .hint{
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.6;
    letter-spacing: 0.02em;
  }

  @media (max-width: 380px){
    .controls{ gap: 14px; }
    .hint{ font-size: 11px; text-align: center; padding: 0 12px; }
  }

  /* ---------- playlist page ---------- */

  .playlist-page{
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: 0;
    gap: 20px;
  }

  .playlist-page.active{
    display: flex;
  }

  .playlist-title{
    font-style: italic;
    font-size: clamp(17px, 2.6vw, 20px);
    color: var(--ink);
    text-align: center;
  }

  .playlist-frame-wrap{
    width: 100%;
    height: min(392px, 52dvh);
    flex-shrink: 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 12px 30px -10px rgba(30, 25, 15, 0.4);
  }

  .playlist-frame-wrap iframe{
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .playlist-open{
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(122, 46, 46, 0.3);
    padding-bottom: 2px;
    align-self: center;
  }

  .playlist-open:hover{
    border-bottom-color: var(--accent);
  }

  /* ---------- cover page ---------- */

  .cover-page{
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    flex: 1;
    min-height: 0;
    gap: 22px;
  }

  .cover-page.active{
    display: flex;
  }

  .cover-seal{
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #9a4444, var(--accent) 65%);
    box-shadow:
      0 6px 14px -4px rgba(122, 46, 46, 0.55),
      inset 0 -3px 6px rgba(0,0,0,0.25),
      inset 0 3px 4px rgba(255,255,255,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f3e6df;
    font-size: 22px;
    font-style: italic;
  }

  .cover-to{
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .cover-title{
    font-size: clamp(24px, 4.5vw, 32px);
    font-style: italic;
    color: var(--ink);
    line-height: 1.3;
    max-width: 22ch;
  }

  .cover-from{
    font-size: 14px;
    color: var(--ink-soft);
    font-style: italic;
  }

  .cover-tap{
    margin-top: 8px;
    font-size: 12px;
    letter-spacing: 0.05em;
    color: var(--ink-soft);
    opacity: 0.65;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="stage">
  <div class="sheet-wrap">
    <div class="sheet">
      <div class="page-number" id="pageNumber"></div>
      <div class="cover-page" id="coverPage">
        <div class="cover-seal">&#9825;</div>
        <div class="cover-to" id="coverTo">To my dearest,</div>

        <div class="cover-from" id="coverFrom">&mdash; with love</div>
      </div>

        <div class="playlist-frame-wrap">
          <iframe
            src="https://open.spotify.com/embed/playlist/1J4NCLlI7kaOjkTdfrfvwg?utm_source=generator&theme=0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"

      </div>

  <div class="controls">

    <div class="dots" id="dots"></div>

  </div>
</div>

<script>

  const pages = [
`year 1 23:19-03/20/20 (2020-2021)

we used to play srabbles, share memes, talk about tons of films, talk about music, talk about memes, talk about music in films, mahal na rin pala natin yung isa't isa non sa sobra nating magbatuhan nung "i love you" hahaha. those are the times na i like remembering about sa atin non, we were young and bored i guess since pandemic din, naglalaro tayo ng ml, nagrreplyan tayo within seconds, pinagpupuyatan natin isa't isa dahil napapahaba daldalan natin.

`year 3 (2022-2023)

nagkakausap pa rin ulit tayo, u told me na di bagay sakin magchoker xd tsaka mas mainam kung hikaw, sabi mo pa ikaw magbutas sa tainga ko hahaha. that was fun, i missed talking to you like how we used to. sa palagay ko, naging atat lang ako na magkaroon ng jowa kaya at sa tingin ko noon na mukhang hindi ko kaya kung magiging magkaibigan lang tayo sa lalim na ng kalilanlan natin sa isat isa noon. you cant be that type of friend to me, i wanted to be your boyfriend mula non and i couldnt tapos noong 2022, nararamdaman ko na parang mahirap na hindi ako mainlab sayo. ganun lang ulit, i shouldve told you something about it pero ewan, feeling ko na takot akong mareject at sa pakiramdam ko ay malamang doon lang din ako mauuwi pag dating sayo. 

noon mo shinare sakin yung short story mo tungkol sa mga bulag, doon tayo nagkwentuhan nang sandamakmak tungkol sa jjba tapos pinanood mo lang kamo kasi sinabi ni aaron ( :< ), marami din akong aya sayo non sa paglabas sa may bulsu okaya naman sa kahit saan basta malabas ka kasi halos puro online lang din ata kayo noon, tsaka nakarami din akong aya sayo non sa chess xd. nakakatuwa ngayong binabalikan ko yung 2022 haha, dami rin pala nating pinagdaldalan non, college na rin tayo non, nadagdagan yung mga paguusapan natin tsaka yung program kong pinagsisihan kong kunin non. noon din ata tayo naging close uli, non ako bumalik sayo o parang mas lalong naging malapit sayo bilang kaibigan mo. i was comfortable then with you, i can freely talk about anything with you, ayos din yung medyo marami na rin tayong alam non sa isa’t isa, umaasa rin ako non kung mailalabas ba kita para i-date ka, friendly date ba ganun ewan catching ups ganun. i liked that time, that phase, o kung anuman iyung part ng 2022 natin, we shared tons of stuff, nakilala ko non ata si sadie, si corvette, saka si cosmo, di ko na alam tbh kung ano pa to(?) xdd pero ewan share ko lang natuwa ako magreminisce ng convo natin non haha even though im not nice and very kupal, i was really glad na kinakausap mo pa rin ako noon, wala sa isip kong pagusapan yung mga past natin non kasi kako baka masira ko yung anong mayroon tayo nun, i mean open naman din ako sa ganung topic if ever pero kasi nakakahiya, di ko rin masabi nun yung nararamdaman ko sayo kasi natatakot pa rin akong mareject tsaka mawala ka sa buhay ko non kaya siguro kaya ko mas napiling ikeep ka bilng close na friend non without romantic na relationship. im such a pussy, i couldnt face kung anong posibleng mangyari satin if ever tsaka i couldnt tell you what i truly felt about you. still, i had a nice time chatting with you, thank you sa mga panahon na yun, di ko pa iyan nasasabi sayo kahit noon. :))
`,

`year 4 (2023-2024)

tapos iyun, it was the new year's eve, nagmessage ka ulit greeting me manigong bagong taon and thanking me for sticking for as long as i have noon. ngayon, i dont really have any idea kung anong sasabihin ko dito, looking back sa convos i just realized na ive been so rude sayo noon and maniwala ka man o hindi sa akin ngayon pero grabe, hindi ako makapaniwalang nasasabi ko yung mga rude stuff sayo non, im really sorry about that. pero ganun lang ulit tayo noong taon na ito, i just randomly message you na para bang hindi na lang ulit ako biglang aalis ulit, yung lulu-lili. medyo nagreconnect din tayo noong 2023 ulit kasi nagtagal akong kausap ka uli haha. alam mo, i never get bored yapping with you, we talked about so much stuff pa noon and im really glad na nir-replyan mo pa rin ako haha. 
`,

`year 5 (2024-2025)

december 15 2023, 
nag-message pa ako sayo. i started dating ms psych na mula nung naudlot na naman ang usapan natin nung 2023 dahil sakin, i was gonna ask you what you would think about me dating other girls after some of our dates and our lengthy daldalan like we were dating na. i thought itd be nice of me rin to let you know about all that kahit na madalas ay kupal ako tapos iniiwan lang din kita nang walang paalam. i wanted to say something din to uh ewan, maybe some closure lang din, thats what i wanted noon kaya ako nagchat, i was gonna say na if ever kako na parang kung mapaguusapan natin nang maayos, baka mas mainam yung setup natin non pero magpapaalam lang ako sayo na nakahanap ako ng ibang kausap non kahit na ba iniisip ko na rin na minsan limot mo na ko.
`,

`year 6 (2025-2026)

june 2025, 
alam mo, after dating ms psych, i realized some stuff about myself. i knew what i wanted noon with you and i just couldnt get myself to act ont it kasi im afraid that i might lose you na nang tuluyan. i thought about my life decisions and ayun, i realized din how dumb how i was. noon ko sinubukan ulit makipagdate, i thought by doing that, it would help me forget about everything na nagkaroon tayo, tsaka kasi inip lang talaga ako. 


i was happy with ms psych, at least i thought i was, i sometimes still find myself looking at our old convos wondering what could have happened kung nagkatuluyan tayo, how nice it would be since ive wanted that for so long tapos ayun, umiiral yung kakupalan ko. then i messaged you looking for another chance with you, i want to make it all up to you, i know how kupal i have been these past few years with you and i deeply regret that i became like that. i want to do more stuff with you, i want to know you better lalo ngayong tengot tengot ako pagdating sa mga stuff about you, i wanted to be like what we were supposed to be-- romantic styles.
`
  ];
  // ---------------------------------------------------------------

  const TOTAL_PAGES = pages.length;
  const TOTAL_SLIDES = TOTAL_PAGES + 2; // + cover page + playlist page
  let current = 0;

  const coverPageEl = document.getElementById('coverPage');
  const contentEl = document.getElementById('pageContent');
  const playlistPageEl = document.getElementById('playlistPage');
  const pageNumberEl = document.getElementById('pageNumber');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function buildDots(){
    dotsEl.innerHTML = '';
    for(let i = 0; i < TOTAL_SLIDES; i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i === current ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }
  }

  function render(){
    const isCover = current === 0;
    const isPlaylist = current === TOTAL_SLIDES - 1;
    const isLetter = !isCover && !isPlaylist;

    coverPageEl.classList.toggle('active', isCover);
    contentEl.style.display = isLetter ? 'block' : 'none';
    playlistPageEl.classList.toggle('active', isPlaylist);

    if(isLetter){
      contentEl.textContent = pages[current - 1];
    }

    if(isCover){
      pageNumberEl.textContent = '';
    } else if(isPlaylist){
      pageNumberEl.textContent = 'playlist';
    } else {
      pageNumberEl.textContent = `${current} / ${TOTAL_PAGES}`;
    }

    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === TOTAL_SLIDES - 1;
    buildDots();
  }

  function goTo(index){
    current = index;
    render();
  }

  prevBtn.addEventListener('click', () => { if(current > 0) goTo(current - 1); });
  nextBtn.addEventListener('click', () => { if(current < TOTAL_SLIDES - 1) goTo(current + 1); });

  coverPageEl.addEventListener('click', () => { if(current === 0) goTo(1); });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft' && current > 0) goTo(current - 1);
    if(e.key === 'ArrowRight' && current < TOTAL_SLIDES - 1) goTo(current + 1);
  });

  // swipe support for mobile
  let touchStartX = 0;
  let touchStartY = 0;

  contentEl.parentElement.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  contentEl.parentElement.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0 && current < TOTAL_SLIDES - 1) goTo(current + 1);
      if(dx > 0 && current > 0) goTo(current - 1);
    }
  }, { passive: true });

  render();
</script>

</body>
</html>
