<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --paper: #f7f3ea;
    --paper-edge: #efe8d8;
    --ink: #2b2620;
    --ink-soft: #5a5346;
    --rule: #d8cfbe;
    --accent: #7a2e2e;
    --desk: #cbc2b0;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    font-family: 'Crimson Pro', Georgia, serif;
    background:
      radial-gradient(ellipse at top, #d7cdb9, var(--desk) 70%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: clamp(16px, 4vw, 32px) 16px;
  }

  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(12px, 2.5vw, 18px);
    width: 100%;
    max-height: 100dvh;
  }

  .sheet-wrap{
    position: relative;
    width: min(640px, 92vw);
  }

  .sheet{
    background: var(--paper);
    background-image: linear-gradient(var(--paper-edge) 1px, transparent 1px);
    background-size: 100% 34px;
    padding: clamp(40px, 8vw, 70px) clamp(24px, 6vw, 60px) clamp(32px, 6vw, 60px);
    height: min(780px, 72dvh);
    box-shadow:
      0 1px 0 var(--paper-edge),
      0 25px 50px -12px rgba(30, 25, 15, 0.35),
      0 8px 16px -8px rgba(30, 25, 15, 0.25);
    position: relative;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sheet::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0%, transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0%, transparent 40%);
    pointer-events: none;
  }

  .page-number{
    position: absolute;
    top: clamp(18px, 4vw, 26px);
    right: clamp(20px, 5vw, 34px);
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-style: italic;
  }

  .page-content{
    flex: 1;
    font-size: clamp(16px, 2.4vw, 19px);
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .signature-line{
    margin-top: 18px;
    height: 1px;
    background: var(--rule);
    display: none;
  }

  .controls{
    display: flex;
    align-items: center;
    gap: 22px;
    user-select: none;
  }

  .nav-btn{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(43, 38, 32, 0.25);
    background: rgba(247, 243, 234, 0.6);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .nav-btn:hover{ background: rgba(247, 243, 234, 0.95); }
  .nav-btn:active{ transform: scale(0.94); }
  .nav-btn:disabled{ opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover{ background: rgba(247, 243, 234, 0.6); }

  .counter{
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    min-width: 64px;
    text-align: center;
  }

  .dots{
    display: flex;
    gap: 8px;
  }

  .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(43, 38, 32, 0.25);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .dot.active{ background: var(--accent); }

  .hint{
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.6;
    letter-spacing: 0.02em;
  }

  @media (max-width: 380px){
    .controls{ gap: 14px; }
    .hint{ font-size: 11px; text-align: center; padding: 0 12px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="sheet-wrap">
    <div class="sheet">
      <div class="page-number" id="pageNumber">1 / 7</div>
      <div class="page-content" id="pageContent"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous page">&#8592;</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next page">&#8594;</button>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // EDIT YOUR LETTER HERE. One string per page, in order.
  // Use \n for line breaks within a page.
  // ---------------------------------------------------------------
  const pages = [
`year 1 23:19-03/20/20 (2020-2021)

dear, Dani

alam mo, i had so much fun with you, i felt like i found myself a really good friend na makakamatch ko sa energy at humor ko. wala akong ideya noong una kung sino ka, naging interesado ako lalo sayo kasi madali mo akong naiintindihan, hindi lang sa mga jokes ko o sa mga punch lines ko sayo pero parang naramdaman ko na malaki yung pagkakaiba ng dating mo sa akin kasi sa ganung paraan ako sayo nagpakilala kaysa sa iba kong mga naging kaibigan o nakausap. nakilala mo ako sa pakikipagdaldalin at medyo pakikipaglandian natin noon, mula doon, naramdaman ko na nagustuhan na kita, naramdaman ko na baka mas maganda kung hindi lang pagiging magkaibigan yung relasyon na gusto natin para sa isa't isa. 

binabalikan ko ngayon yung mga convo natin 6 years ago: sobrang corny at baduy ko, buti na lang talaga napagtiyagaan mo ako.

we started with the most basic and cliche lines, how i got to know you better is dahil sa mga used na lines ko pero there's more than that, nakilala kita nang hindi ko namamalayan na hindi ko na kailangang ibahin yung sarili ko. i mean, i just have to become what i usually and originally am kasi thats how you knew me then. that was speical to me, the mere fact na hindi ko kailangang haluan ng pagpapanggap para lang magustuhan mo ako bilang kaibigan o kausap mo nung oras na yun. don't get me wrong, i didnt talk to you then kasi i was bored, i talked to you kasi nakuha mo yung atensyon ko, pakiramdam ko na there'd be something id look forward to kasi ikaw na yun.

we used to play srabbles, share memes, talk about tons of films, talk about music, talk about memes, talk about music in films, mahal na rin pala natin yung isa't isa non sa sobra nating magbatuhan nung "i love you" hahaha. those are the times na i like remembering about sa atin non, we were young and bored i guess since pandemic din, naglalaro tayo ng ml, nagrreplyan tayo within seconds, pinagpupuyatan natin isa't isa dahil napapahaba daldalan natin.

bago ako magbirthday noon, nakita ko dito sa mga convo na doon ako nagsimulang maging kupal sayo, inuna ko na yung sarili ko at hindi ko na intindi yung mararamdan mo o yung nararamdaman mo sa akin non. doon ako nagdesisyon non na gusto ko nang magjowa, iyun talaga yung pakay ko noon sayo, gusto kitang kilalanin, kaibiganin, hanggang sa makilala ko yung mga tao sa buhay mo tsaka magpaalam sayo kung pwede ba akong manligaw sayo, hindi ko man lang nagawang sabihin sayo nun, mahirap din sitwasyon natin non- pandemic, 

you wanted to be friends, i thought u were trying to make it clear nang hindi dinederekta, i wanted us to be more than that, i was impatient and stupid.
`,

`year 2 (2021-2022)

vvyharveyvvyhary vahry

mula nung after new year, doon na pala ulit ako nangungulit sayo. nakakatuwa na ineentertain mo pa rin ako kahit ba naging kupal ako sayo.`,

`year 3 (2022-2023)

april 2022, 

nagkakausap pa rin ulit tayo, u told me na di bagay sakin magchoker xd tsaka mas mainam kung hikaw, sabi mo pa ikaw magbutas sa tainga ko hahaha. that was fun, i missed talking to you like how we used to. sa palagay ko, naging atat lang ako na magkaroon ng jowa kaya at sa tingin ko noon na mukhang hindi ko kaya kung magiging magkaibigan lang tayo sa lalim na ng kalilanlan natin sa isat isa noon. you cant be that type of friend to me, i wanted to be your boyfriend mula non and i couldnt tapos noong 2022, nararamdaman ko na parang mahirap na hindi ako mainlab sayo. ganun lang ulit, i shouldve told you something about it pero ewan, feeling ko na takot akong mareject at sa pakiramdam ko ay malamang doon lang din ako mauuwi pag dating sayo. 

noon mo shinare sakin yung short story mo tungkol sa mga bulag, doon tayo nagkwentuhan nang sandamakmak tungkol sa jjba tapos pinanood mo lang kamo kasi sinabi ni aaron ( :< ), marami din akong aya sayo non sa paglabas sa may bulsu okaya naman sa kahit saan basta malabas ka kasi halos puro online lang din ata kayo noon, tsaka nakarami din akong aya sayo non sa chess xd. nakakatuwa ngayong binabalikan ko yung 2022 haha, dami rin pala nating pinagdaldalan non, college na rin tayo non, nadagdagan yung mga paguusapan natin tsaka yung program kong pinagsisihan kong kunin non. noon din ata tayo naging close uli, non ako bumalik sayo o parang mas lalong naging malapit sayo bilang kaibigan mo. i was comfortable then with you, i can freely talk about anything with you, ayos din yung medyo marami na rin tayong alam non sa isa’t isa, umaasa rin ako non kung mailalabas ba kita para i-date ka, friendly date ba ganun ewan catching ups ganun. i liked that time, that phase, o kung anuman iyung part ng 2022 natin, we shared tons of stuff, nakilala ko non ata si sadie, si corvette, saka si cosmo, di ko na alam tbh kung ano pa to(?) xdd pero ewan share ko lang natuwa ako magreminisce ng convo natin non haha even though im not nice and very kupal, i was really glad na kinakausap mo pa rin ako noon, wala sa isip kong pagusapan yung mga past natin non kasi kako baka masira ko yung anong mayroon tayo nun, i mean open naman din ako sa ganung topic if ever pero kasi nakakahiya, di ko rin masabi nun yung nararamdaman ko sayo kasi natatakot pa rin akong mareject tsaka mawala ka sa buhay ko non kaya siguro kaya ko mas napiling ikeep ka bilng close na friend non without romantic na relationship. im such a pussy, i couldnt face kung anong posibleng mangyari satin if ever tsaka i couldnt tell you what i truly felt about you. still, i had a nice time chatting with you, thank you sa mga panahon na yun, di ko pa iyan nasasabi sayo kahit noon. :))`,

`year 4 (2023-2024)

`year 5 (2024-2025)

`year 6 (2025-2026)

i couldnt stop thinking about you, i started digging our old convos, thought about my life decisions and ayun, i realized how dumb how i was.`,

`year 7 (2026-2027)

dear, Dani`
  ];
  // ---------------------------------------------------------------

  const TOTAL_PAGES = pages.length;
  let current = 0;

  const contentEl = document.getElementById('pageContent');
  const pageNumberEl = document.getElementById('pageNumber');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function buildDots(){
    dotsEl.innerHTML = '';
    for(let i = 0; i < TOTAL_PAGES; i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i === current ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }
  }

  function render(){
    contentEl.textContent = pages[current];
    pageNumberEl.textContent = `${current + 1} / ${TOTAL_PAGES}`;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === TOTAL_PAGES - 1;
    buildDots();
  }

  function goTo(index){
    current = index;
    render();
  }

  prevBtn.addEventListener('click', () => { if(current > 0) goTo(current - 1); });
  nextBtn.addEventListener('click', () => { if(current < TOTAL_PAGES - 1) goTo(current + 1); });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft' && current > 0) goTo(current - 1);
    if(e.key === 'ArrowRight' && current < TOTAL_PAGES - 1) goTo(current + 1);
  });

  // swipe support for mobile
  let touchStartX = 0;
  let touchStartY = 0;

  contentEl.parentElement.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  contentEl.parentElement.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0 && current < TOTAL_PAGES - 1) goTo(current + 1);
      if(dx > 0 && current > 0) goTo(current - 1);
    }
  }, { passive: true });

  render();
</script>

</body>
</html>
