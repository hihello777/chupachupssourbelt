<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --paper: #f7f3ea;
    --paper-edge: #efe8d8;
    --ink: #2b2620;
    --ink-soft: #5a5346;
    --rule: #d8cfbe;
    --accent: #7a2e2e;
    --desk: #cbc2b0;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    font-family: 'Crimson Pro', Georgia, serif;
    background:
      radial-gradient(ellipse at top, #d7cdb9, var(--desk) 70%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 32px 16px;
  }

  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
    width: 100%;
  }

  .sheet-wrap{
    position: relative;
    width: min(640px, 92vw);
  }

  .sheet{
    background: var(--paper);
    background-image: linear-gradient(var(--paper-edge) 1px, transparent 1px);
    background-size: 100% 34px;
    padding: 70px 60px 60px;
    min-height: 780px;
    box-shadow:
      0 1px 0 var(--paper-edge),
      0 25px 50px -12px rgba(30, 25, 15, 0.35),
      0 8px 16px -8px rgba(30, 25, 15, 0.25);
    position: relative;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  .sheet::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0%, transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0%, transparent 40%);
    pointer-events: none;
  }

  .page-number{
    position: absolute;
    top: 26px;
    right: 34px;
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-style: italic;
  }

  .page-content{
    flex: 1;
    font-size: 19px;
    line-height: 34px;
    color: var(--ink);
    white-space: pre-wrap;
    outline: none;
  }

  .page-content:empty::before{
    content: attr(data-placeholder);
    color: var(--ink-soft);
    opacity: 0.55;
    font-style: italic;
  }

  .page-content:focus{
    background: rgba(122, 46, 46, 0.03);
  }

  .signature-line{
    margin-top: 18px;
    height: 1px;
    background: var(--rule);
    display: none;
  }

  .controls{
    display: flex;
    align-items: center;
    gap: 22px;
    user-select: none;
  }

  .nav-btn{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(43, 38, 32, 0.25);
    background: rgba(247, 243, 234, 0.6);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .nav-btn:hover{ background: rgba(247, 243, 234, 0.95); }
  .nav-btn:active{ transform: scale(0.94); }
  .nav-btn:disabled{ opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover{ background: rgba(247, 243, 234, 0.6); }

  .counter{
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    min-width: 64px;
    text-align: center;
  }

  .dots{
    display: flex;
    gap: 8px;
  }

  .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(43, 38, 32, 0.25);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .dot.active{ background: var(--accent); }

  .hint{
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.6;
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px){
    .sheet{ padding: 50px 26px 40px; min-height: 640px; }
    .page-content{ font-size: 17px; line-height: 30px; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="sheet-wrap">
    <div class="sheet">
      <div class="page-number" id="pageNumber">1 / 7</div>
      <div class="page-content"
           id="pageContent"
           contenteditable="true"
           data-placeholder="Write page one here..."></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous page">&#8592;</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next page">&#8594;</button>
  </div>

  <div class="hint">click the page to write &middot; use the arrows or &larr; &rarr; keys to turn pages</div>
</div>

<script>
  const TOTAL_PAGES = 7;
  const STORAGE_KEY = 'letter-pages';

  let pages = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null')
    || Array(TOTAL_PAGES).fill('');

  let current = 0;

  const contentEl = document.getElementById('pageContent');
  const pageNumberEl = document.getElementById('pageNumber');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function buildDots(){
    dotsEl.innerHTML = '';
    for(let i = 0; i < TOTAL_PAGES; i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i === current ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }
  }

  function save(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(pages));
  }

  function render(){
    contentEl.textContent = pages[current];
    contentEl.setAttribute('data-placeholder', `Write page ${current + 1} here...`);
    pageNumberEl.textContent = `${current + 1} / ${TOTAL_PAGES}`;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === TOTAL_PAGES - 1;
    buildDots();
    contentEl.focus();
    placeCaretAtEnd(contentEl);
  }

  function placeCaretAtEnd(el){
    el.focus();
    if (typeof window.getSelection != "undefined" && typeof document.createRange != "undefined") {
      const range = document.createRange();
      range.selectNodeContents(el);
      range.collapse(false);
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
    }
  }

  function goTo(index){
    pages[current] = contentEl.textContent;
    save();
    current = index;
    render();
  }

  prevBtn.addEventListener('click', () => { if(current > 0) goTo(current - 1); });
  nextBtn.addEventListener('click', () => { if(current < TOTAL_PAGES - 1) goTo(current + 1); });

  contentEl.addEventListener('input', () => {
    pages[current] = contentEl.textContent;
    save();
  });

  document.addEventListener('keydown', (e) => {
    if(document.activeElement === contentEl){
      return;
    }
    if(e.key === 'ArrowLeft' && current > 0) goTo(current - 1);
    if(e.key === 'ArrowRight' && current < TOTAL_PAGES - 1) goTo(current + 1);
  });

  render();
</script>

</body>
</html>
