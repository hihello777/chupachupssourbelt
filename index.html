<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --paper: #f7f3ea;
    --paper-edge: #efe8d8;
    --ink: #2b2620;
    --ink-soft: #5a5346;
    --rule: #d8cfbe;
    --accent: #7a2e2e;
    --desk: #cbc2b0;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    font-family: 'Crimson Pro', Georgia, serif;
    background:
      radial-gradient(ellipse at top, #d7cdb9, var(--desk) 70%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: clamp(16px, 4vw, 32px) 16px;
  }

  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(12px, 2.5vw, 18px);
    width: 100%;
    max-height: 100dvh;
  }

  .sheet-wrap{
    position: relative;
    width: min(640px, 92vw);
  }

  .sheet{
    background: var(--paper);
    background-image: linear-gradient(var(--paper-edge) 1px, transparent 1px);
    background-size: 100% 34px;
    padding: clamp(40px, 8vw, 70px) clamp(24px, 6vw, 60px) clamp(32px, 6vw, 60px);
    height: min(780px, 72dvh);
    box-shadow:
      0 1px 0 var(--paper-edge),
      0 25px 50px -12px rgba(30, 25, 15, 0.35),
      0 8px 16px -8px rgba(30, 25, 15, 0.25);
    position: relative;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sheet::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0%, transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0%, transparent 40%);
    pointer-events: none;
  }

  .page-number{
    position: absolute;
    top: clamp(18px, 4vw, 26px);
    right: clamp(20px, 5vw, 34px);
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-style: italic;
  }

  .page-content{
    flex: 1;
    font-size: clamp(16px, 2.4vw, 19px);
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .signature-line{
    margin-top: 18px;
    height: 1px;
    background: var(--rule);
    display: none;
  }

  .controls{
    display: flex;
    align-items: center;
    gap: 22px;
    user-select: none;
  }

  .nav-btn{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(43, 38, 32, 0.25);
    background: rgba(247, 243, 234, 0.6);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .nav-btn:hover{ background: rgba(247, 243, 234, 0.95); }
  .nav-btn:active{ transform: scale(0.94); }
  .nav-btn:disabled{ opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover{ background: rgba(247, 243, 234, 0.6); }

  .counter{
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    min-width: 64px;
    text-align: center;
  }

  .dots{
    display: flex;
    gap: 8px;
  }

  .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(43, 38, 32, 0.25);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .dot.active{ background: var(--accent); }

  .hint{
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.6;
    letter-spacing: 0.02em;
  }

  @media (max-width: 380px){
    .controls{ gap: 14px; }
    .hint{ font-size: 11px; text-align: center; padding: 0 12px; }
  }

  /* ---------- playlist page ---------- */

  .playlist-page{
    display: none;
    flex-direction: column;
    height: 100%;
    gap: 18px;
  }

  .playlist-page.active{
    display: flex;
  }

  .playlist-title{
    font-style: italic;
    font-size: clamp(17px, 2.6vw, 20px);
    color: var(--ink);
    text-align: center;
  }

  .playlist-frame-wrap{
    flex: 1;
    min-height: 0;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 6px 18px -8px rgba(30, 25, 15, 0.35);
  }

  .playlist-frame-wrap iframe{
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }

  .playlist-open{
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.03em;
    color: var(--accent);
    text-decoration: none;
    border-bottom: 1px solid rgba(122, 46, 46, 0.3);
    padding-bottom: 2px;
    align-self: center;
  }

  .playlist-open:hover{
    border-bottom-color: var(--accent);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="sheet-wrap">
    <div class="sheet">
      <div class="page-number" id="pageNumber">1 / 7</div>
      <div class="page-content" id="pageContent"></div>
      <div class="playlist-page" id="playlistPage">
        <div class="playlist-title">a little something for the road</div>
        <div class="playlist-frame-wrap">
          <iframe
            src="https://open.spotify.com/embed/playlist/1J4NCLlI7kaOjkTdfrfvwg?utm_source=generator&theme=0"
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
            loading="lazy"
            title="Spotify playlist player">
          </iframe>
        </div>
        <a class="playlist-open" href="https://open.spotify.com/playlist/1J4NCLlI7kaOjkTdfrfvwg?si=wZF0JG0XTvSQ73KaIC95Bw" target="_blank" rel="noopener">Open in Spotify &#8599;</a>
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous page">&#8592;</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next page">&#8594;</button>
  </div>

  <div class="hint">swipe, use the arrows, or press &larr; &rarr; to turn pages</div>
</div>

<script>
  // ---------------------------------------------------------------
  // EDIT YOUR LETTER HERE. One string per page, in order.
  // Use \n for line breaks within a page.
  // ---------------------------------------------------------------
  const pages = [
`Page one text goes here.

Write as many paragraphs as you like — line breaks are kept exactly as you type them.`,

`Page two text goes here.`,

`Page three text goes here.`,

`Page four text goes here.`,

`Page five text goes here.`,

`Page six text goes here.`,

`Page seven text goes here.`
  ];
  // ---------------------------------------------------------------

  const TOTAL_PAGES = pages.length;
  const TOTAL_SLIDES = TOTAL_PAGES + 1; // + 1 playlist page at the end
  let current = 0;

  const contentEl = document.getElementById('pageContent');
  const playlistPageEl = document.getElementById('playlistPage');
  const pageNumberEl = document.getElementById('pageNumber');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function buildDots(){
    dotsEl.innerHTML = '';
    for(let i = 0; i < TOTAL_SLIDES; i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i === current ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }
  }

  function render(){
    const isPlaylist = current === TOTAL_PAGES;

    contentEl.style.display = isPlaylist ? 'none' : 'block';
    playlistPageEl.classList.toggle('active', isPlaylist);

    if(!isPlaylist){
      contentEl.textContent = pages[current];
    }

    pageNumberEl.textContent = isPlaylist ? `playlist` : `${current + 1} / ${TOTAL_PAGES}`;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === TOTAL_SLIDES - 1;
    buildDots();
  }

  function goTo(index){
    current = index;
    render();
  }

  prevBtn.addEventListener('click', () => { if(current > 0) goTo(current - 1); });
  nextBtn.addEventListener('click', () => { if(current < TOTAL_SLIDES - 1) goTo(current + 1); });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft' && current > 0) goTo(current - 1);
    if(e.key === 'ArrowRight' && current < TOTAL_SLIDES - 1) goTo(current + 1);
  });

  // swipe support for mobile
  let touchStartX = 0;
  let touchStartY = 0;

  contentEl.parentElement.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  contentEl.parentElement.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0 && current < TOTAL_SLIDES - 1) goTo(current + 1);
      if(dx > 0 && current > 0) goTo(current - 1);
    }
  }, { passive: true });

  render();
</script>

</body>
</html>
