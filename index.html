<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Letter</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&display=swap');

  :root{
    --paper: #f7f3ea;
    --paper-edge: #efe8d8;
    --ink: #2b2620;
    --ink-soft: #5a5346;
    --rule: #d8cfbe;
    --accent: #7a2e2e;
    --desk: #cbc2b0;
  }

  *{ box-sizing: border-box; }

  html, body{
    height: 100%;
    margin: 0;
  }

  body{
    font-family: 'Crimson Pro', Georgia, serif;
    background:
      radial-gradient(ellipse at top, #d7cdb9, var(--desk) 70%);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100dvh;
    padding: clamp(16px, 4vw, 32px) 16px calc(clamp(16px, 4vw, 32px) + 96px);
  }

  .stage{
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(12px, 2.5vw, 18px);
    width: 100%;
    max-height: 100dvh;
  }

  .sheet-wrap{
    position: relative;
    width: min(640px, 92vw);
  }

  .sheet{
    background: var(--paper);
    background-image: linear-gradient(var(--paper-edge) 1px, transparent 1px);
    background-size: 100% 34px;
    padding: clamp(40px, 8vw, 70px) clamp(24px, 6vw, 60px) clamp(32px, 6vw, 60px);
    height: min(780px, 72dvh);
    box-shadow:
      0 1px 0 var(--paper-edge),
      0 25px 50px -12px rgba(30, 25, 15, 0.35),
      0 8px 16px -8px rgba(30, 25, 15, 0.25);
    position: relative;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .sheet::before{
    content: "";
    position: absolute;
    inset: 0;
    background-image: radial-gradient(circle at 20% 30%, rgba(0,0,0,0.015) 0%, transparent 40%),
                       radial-gradient(circle at 80% 70%, rgba(0,0,0,0.015) 0%, transparent 40%);
    pointer-events: none;
  }

  .page-number{
    position: absolute;
    top: clamp(18px, 4vw, 26px);
    right: clamp(20px, 5vw, 34px);
    font-size: 13px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    font-style: italic;
  }

  .page-content{
    flex: 1;
    font-size: clamp(16px, 2.4vw, 19px);
    line-height: 1.75;
    color: var(--ink);
    white-space: pre-wrap;
  }

  .signature-line{
    margin-top: 18px;
    height: 1px;
    background: var(--rule);
    display: none;
  }

  .controls{
    display: flex;
    align-items: center;
    gap: 22px;
    user-select: none;
  }

  .nav-btn{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(43, 38, 32, 0.25);
    background: rgba(247, 243, 234, 0.6);
    color: var(--ink);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .nav-btn:hover{ background: rgba(247, 243, 234, 0.95); }
  .nav-btn:active{ transform: scale(0.94); }
  .nav-btn:disabled{ opacity: 0.3; cursor: default; }
  .nav-btn:disabled:hover{ background: rgba(247, 243, 234, 0.6); }

  .counter{
    font-size: 14px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    min-width: 64px;
    text-align: center;
  }

  .dots{
    display: flex;
    gap: 8px;
  }

  .dot{
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(43, 38, 32, 0.25);
    cursor: pointer;
    transition: background 0.15s ease;
  }

  .dot.active{ background: var(--accent); }

  .hint{
    font-size: 12px;
    color: var(--ink-soft);
    opacity: 0.6;
    letter-spacing: 0.02em;
  }

  @media (max-width: 380px){
    .controls{ gap: 14px; }
    .hint{ font-size: 11px; text-align: center; padding: 0 12px; }
  }

  /* ---------- Spotify player dock ---------- */

  .player-dock{
    position: fixed;
    left: 50%;
    bottom: max(14px, env(safe-area-inset-bottom));
    transform: translateX(-50%);
    width: min(640px, 92vw);
    z-index: 40;
    background: rgba(247, 243, 234, 0.92);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 20px;
    box-shadow:
      0 -2px 0 rgba(255,255,255,0.4) inset,
      0 18px 40px -10px rgba(30, 25, 15, 0.4),
      0 4px 12px -4px rgba(30, 25, 15, 0.3);
    overflow: hidden;
    border: 1px solid rgba(43, 38, 32, 0.08);
    transition: border-radius 0.3s ease;
  }

  .player-handle{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 18px;
    cursor: pointer;
    user-select: none;
  }

  .player-grip{
    position: absolute;
    top: 7px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 4px;
    border-radius: 3px;
    background: rgba(43, 38, 32, 0.18);
  }

  .player-label{
    flex: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--ink-soft);
    padding-top: 6px;
  }

  .player-note{
    font-size: 15px;
  }

  .player-chevron{
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
    transition: transform 0.3s ease;
    margin-top: 6px;
    flex-shrink: 0;
  }

  .player-dock.expanded .player-chevron{
    transform: rotate(180deg);
  }

  .player-body{
    padding: 0 8px 8px;
  }

  .player-body iframe{
    display: block;
    width: 100%;
    border: 0;
    border-radius: 12px;
    height: 84px;
    transition: height 0.35s ease;
  }

  .player-dock.expanded .player-body iframe{
    height: min(452px, 58dvh);
  }
</style>
</head>
<body>

<div class="stage">
  <div class="sheet-wrap">
    <div class="sheet">
      <div class="page-number" id="pageNumber">1 / 7</div>
      <div class="page-content" id="pageContent"></div>
    </div>
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" aria-label="Previous page">&#8592;</button>
    <div class="dots" id="dots"></div>
    <button class="nav-btn" id="nextBtn" aria-label="Next page">&#8594;</button>
  </div>
</div>

<div class="player-dock" id="playerDock">
  <div class="player-grip"></div>
  <div class="player-handle" id="playerHandle">
    <div class="player-label"><span class="player-note">&#9834;</span> Playlist</div>
    <div class="player-chevron" id="playerChevron">&#9650;</div>
  </div>
  <div class="player-body">
    <iframe
      id="playerFrame"
      src="https://open.spotify.com/embed/playlist/1J4NCLlI7kaOjkTdfrfvwg?utm_source=generator&theme=0"
      allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
      loading="lazy"
      title="Spotify playlist player">
    </iframe>
  </div>
</div>

<script>
  // ---------------------------------------------------------------
  // EDIT YOUR LETTER HERE. One string per page, in order.
  // Use \n for line breaks within a page.
  // ---------------------------------------------------------------
  const pages = [
`year 1 23:19-03/20/20 (2020-2021)

dear, Dani

alam mo, i had so much fun with you, i felt like i found myself a really good friend na makakamatch ko sa energy at humor ko. wala akong ideya noong una kung sino ka, naging interesado ako lalo sayo kasi madali mo akong naiintindihan, hindi lang sa mga jokes ko o sa mga punch lines ko sayo pero parang naramdaman ko na malaki yung pagkakaiba ng dating mo sa akin kasi sa ganung paraan ako sayo nagpakilala kaysa sa iba kong mga naging kaibigan o nakausap. nakilala mo ako sa pakikipagdaldalin at medyo pakikipaglandian natin noon, mula doon, naramdaman ko na nagustuhan na kita, naramdaman ko na baka mas maganda kung hindi lang pagiging magkaibigan yung relasyon na gusto natin para sa isa't isa. 

binabalikan ko ngayon yung mga convo natin 6 years ago: sobrang corny at baduy ko, buti na lang talaga napagtiyagaan mo ako.

we started with the most basic and cliche lines, how i got to know you better is dahil sa mga used na lines ko pero there's more than that, nakilala kita nang hindi ko namamalayan na hindi ko na kailangang ibahin yung sarili ko. i mean, i just have to become what i usually and originally am kasi thats how you knew me then. that was speical to me, the mere fact na hindi ko kailangang haluan ng pagpapanggap para lang magustuhan mo ako bilang kaibigan o kausap mo nung oras na yun. don't get me wrong, i didnt talk to you then kasi i was bored, i talked to you kasi nakuha mo yung atensyon ko, pakiramdam ko na there'd be something id look forward to kasi ikaw na yun.

we used to play srabbles, share memes, talk about tons of films, talk about music, talk about memes, talk about music in films, mahal na rin pala natin yung isa't isa non sa sobra nating magbatuhan nung "i love you" hahaha. those are the times na i like remembering about sa atin non, we were young and bored i guess since pandemic din, naglalaro tayo ng ml, nagrreplyan tayo within seconds, pinagpupuyatan natin isa't isa dahil napapahaba daldalan natin.

bago ako magbirthday noon, nakita ko dito sa mga convo na doon ako nagsimulang maging kupal sayo, inuna ko na yung sarili ko at hindi ko na intindi yung mararamdan mo o yung nararamdaman mo sa akin non. doon ako nagdesisyon non na gusto ko nang magjowa, iyun talaga yung pakay ko noon sayo, gusto kitang kilalanin, kaibiganin, hanggang sa makilala ko yung mga tao sa buhay mo tsaka magpaalam sayo kung pwede ba akong manligaw sayo, hindi ko man lang nagawang sabihin sayo nun, mahirap din sitwasyon natin non- pandemic, 

you wanted to be friends, i thought u were trying to make it clear nang hindi dinederekta, i wanted us to be more than that, i was impatient and stupid.
`,

`Page two text goes here.`,

`Page three text goes here.`,

`Page four text goes here.`,

`Page five text goes here.`,

`Page six text goes here.`,

`Page seven text goes here.`
  ];
  // ---------------------------------------------------------------

  const TOTAL_PAGES = pages.length;
  let current = 0;

  const contentEl = document.getElementById('pageContent');
  const pageNumberEl = document.getElementById('pageNumber');
  const dotsEl = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  function buildDots(){
    dotsEl.innerHTML = '';
    for(let i = 0; i < TOTAL_PAGES; i++){
      const d = document.createElement('div');
      d.className = 'dot' + (i === current ? ' active' : '');
      d.addEventListener('click', () => goTo(i));
      dotsEl.appendChild(d);
    }
  }

  function render(){
    contentEl.textContent = pages[current];
    pageNumberEl.textContent = `${current + 1} / ${TOTAL_PAGES}`;
    prevBtn.disabled = current === 0;
    nextBtn.disabled = current === TOTAL_PAGES - 1;
    buildDots();
  }

  function goTo(index){
    current = index;
    render();
  }

  prevBtn.addEventListener('click', () => { if(current > 0) goTo(current - 1); });
  nextBtn.addEventListener('click', () => { if(current < TOTAL_PAGES - 1) goTo(current + 1); });

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowLeft' && current > 0) goTo(current - 1);
    if(e.key === 'ArrowRight' && current < TOTAL_PAGES - 1) goTo(current + 1);
  });

  // swipe support for mobile
  let touchStartX = 0;
  let touchStartY = 0;

  contentEl.parentElement.addEventListener('touchstart', (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  contentEl.parentElement.addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].screenX - touchStartX;
    const dy = e.changedTouches[0].screenY - touchStartY;
    if(Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)){
      if(dx < 0 && current < TOTAL_PAGES - 1) goTo(current + 1);
      if(dx > 0 && current > 0) goTo(current - 1);
    }
  }, { passive: true });

  // player dock expand/collapse
  const playerDock = document.getElementById('playerDock');
  const playerHandle = document.getElementById('playerHandle');

  playerHandle.addEventListener('click', () => {
    playerDock.classList.toggle('expanded');
  });

  render();
</script>

</body>
</html>
